name: Release

# Build and publish a GitHub Release with the .deb and .AppImage whenever a
# version tag (e.g. v0.2.0) is pushed. Can also be run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # needed to create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folioo ${{ github.ref_name }}"
          releaseBody: "Download the `.deb` (Debian/Ubuntu), `.rpm` (Fedora), `.AppImage` (run directly) or `.flatpak` from the Assets below."
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage

  # ── Flatpak (built from the .deb, installed into the GNOME 46 runtime) ──
  flatpak:
    needs: release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub + install the GNOME runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Fetch the .deb from this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deb
          gh release download "${GITHUB_REF_NAME}" -p "*amd64.deb" --dir /tmp/deb
          cp /tmp/deb/*.deb flatpak/folioo.deb

      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-cache --disable-rofiles-fuse --repo flatpak-repo flatpak-build flatpak/org.folioo.app.yml
          flatpak build-bundle flatpak-repo "folioo_${GITHUB_REF_NAME}.flatpak" org.folioo.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Attach the .flatpak to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "folioo_${GITHUB_REF_NAME}.flatpak" --clobber
