[package]
name = "folioo"
version = "0.1.0"
description = "Folioo — an open-source Apple Notes alternative for Linux"
authors = ["Folioo"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

# The library is what the binary and (potentially) mobile targets link against.
[lib]
name = "folioo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
# Note: LTO + codegen-units=1 are intentionally NOT enabled. They cut a few
# hundred KB but make the final link very memory-hungry, which OOM-kills the
# build on constrained machines (e.g. WSL). This profile links comfortably.
