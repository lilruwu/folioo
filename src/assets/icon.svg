<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Folioo">
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="114"/></clipPath>
    <linearGradient id="paper" x1="80" y1="40" x2="440" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F1E8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="120" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9A02E"/>
      <stop offset="1" stop-color="#CE7E12"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#paper)"/>

    <!-- ruled lines (paper) -->
    <rect x="92" y="236" width="328" height="22" rx="11" fill="#E7E4DA"/>
    <rect x="92" y="290" width="328" height="22" rx="11" fill="#E7E4DA"/>
    <rect x="92" y="344" width="244" height="22" rx="11" fill="#E7E4DA"/>
    <rect x="92" y="398" width="300" height="22" rx="11" fill="#E7E4DA"/>

    <!-- colored header band -->
    <rect width="512" height="150" fill="url(#band)"/>
    <rect x="0" y="150" width="512" height="3" fill="rgba(0,0,0,0.08)"/>

    <!-- spiral binding tabs -->
    <rect x="111" y="110" width="20" height="86" rx="10" fill="#FBFAF6"/>
    <circle cx="121" cy="126" r="4.5" fill="#B5710F"/>
    <rect x="231" y="110" width="20" height="86" rx="10" fill="#FBFAF6"/>
    <circle cx="241" cy="126" r="4.5" fill="#B5710F"/>
    <rect x="351" y="110" width="20" height="86" rx="10" fill="#FBFAF6"/>
    <circle cx="361" cy="126" r="4.5" fill="#B5710F"/>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="3"/>
</svg>
